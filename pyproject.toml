[project]
name = "persian-morphology"
version = "0.1.0"
description = "A finite-state Persian morphological analyzer using HFST, and based on distributed morphology."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "hfst>=3.16.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
